<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>注册表单</title>
</head>
<body>
    <h2>用户注册</h2>
    <form>
        <div>
            <label>用户名：</label>
            <input type="text" name="username">
        </div>
        <div style="margin-top:8px">
            <label>密码：</label>
            <input type="password" name="pwd">
        </div>
        <div style="margin-top:8px">
            <label>邮箱：</label>
            <input type="email" name="email">
        </div>
        <div style="margin-top:12px">
            <input type="submit" value="提交">
        </div>
    </form>
</body>
</html>
